version: '3.8'

services:
  app:
    build: .
    ports:
      - "8000:8000"
      - "8501:8501"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - PINECONE_API_KEY=${PINECONE_API_KEY}
      - PINECONE_INDEX_NAME=${PINECONE_INDEX_NAME:-supply-chain-kb}
      - NEWS_API_KEY=${NEWS_API_KEY}
      - DATABASE_URL=${DATABASE_URL:-sqlite:///./supply_chain.db}
